# openlb-agent 的 nginx 基础配置：把 agent 渲染的 http / stream 配置分别 include 进
# 对应 context。agent 把文件写到 conf.d/http/ 与 conf.d/stream/，这里负责把它们装进来。
user  nginx;
worker_processes  auto;
pid /run/nginx.pid;

# 官方 nginx:stable 镜像已静态内建 stream 模块，可直接使用 stream{}。
# 若你的 nginx 是把 stream 编为动态模块（nginx -V 显示 --with-stream=dynamic），
# 需在此处放开下面这行：
# load_module modules/ngx_stream_module.so;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # http server 模板里 proxy_set_header Connection $connection_upgrade 依赖此 map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # stub_status 用于采集七层(HTTP)连接数指标
    # 仅监听 127.0.0.1，避免暴露到外部
    server {
        listen 127.0.0.1:8888;
        location /nginx_status {
            stub_status;
            access_log off;
        }
    }

    # agent 渲染的 http / https server 与 upstream
    include conf.d/http/*.conf;
}

stream {
    # agent 渲染的 tcp / udp server 与 upstream
    include conf.d/stream/*.conf;
}
