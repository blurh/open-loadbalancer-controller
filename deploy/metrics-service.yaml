apiVersion: v1
kind: Service
metadata:
  name: openlb-controller-metrics
  namespace: openlb-system
  labels:
    app: openlb-controller
spec:
  ports:
  - name: metrics
    port: 8081
    targetPort: metrics
    protocol: TCP
  selector:
    app: openlb-controller
  type: ClusterIP
---
# ServiceMonitor for Prometheus Operator (optional)
# 需要集群中已安装 Prometheus Operator
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openlb-controller
  namespace: openlb-system
  labels:
    app: openlb-controller
spec:
  selector:
    matchLabels:
      app: openlb-controller
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
